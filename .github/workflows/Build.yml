name: Build PrismELF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - run: apk add --no-cache build-base git zip python3 py3-pillow ffmpeg

      - uses: actions/checkout@v4

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Convert images/ -> assets/ (tools/covert-images.py)
        run: python3 tools/covert-images.py

      - name: Convert music/ for the PS2 (tools/covert-bgm.py)
        run: python3 tools/covert-bgm.py --max-mb 4

      - name: Build
        run: make clean && make

      - name: Package
        run: |
          mkdir -p dist/PrismELF
          cp PrismELF.elf README.md LICENSE dist/PrismELF/
          cp -r images dist/PrismELF/images
          cd dist && zip -r PrismELF.zip PrismELF && sha256sum PrismELF/PrismELF.elf PrismELF.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PrismELF
          path: |
            PrismELF.elf
            dist/PrismELF.zip
            dist/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            PrismELF.elf
            dist/PrismELF.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
